[package]
name = "apexdaemon"
version = "0.1.0"
edition = "2021"
description = "Plugin-style background automation daemon: theme sync, fleet health, security watch, vault backup, repo housekeeping"
license = "MIT"

[[bin]]
name = "apexdaemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1"
notify = "6"
git2 = "0.19"
chrono = { version = "0.4", features = ["serde"] }
cybercore = "0.4"
