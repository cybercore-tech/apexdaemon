# Copy to ~/.config/apexdaemon/config.toml and edit. Every field shown
# here is also the built-in default. An absent file, or an empty one, runs
# the established plugins with those defaults; the dotfiles doctor stays
# opt-in until its manifests have been reviewed.

[general]
notify = true   # desktop notifications via notify-send, best-effort

[plugins]
theme_sync = true
fleet_health = true
security = true
vault_backup = true
repo_housekeeping = true
dotfiles = false   # enable after creating the two explicit manifests
profiles = false   # enable after creating an active machine profile
validation = false # enable local asset checks and read-only CI reminders

[theme_sync]
cybercore_root = "~/.sysops/cybercore"
family = "omarchy-live"   # kept separate from the 72 hand-curated themes
post_hooks = []

[fleet_health]
interval_secs = 60
restart_backoff_secs = 300

# cyberdeck and its diagnostics deck are already systemd system units
# (/etc/systemd/system/cyberdeck.service, cyberdeck-diag-deck.service)
# with their own Restart=on-failure — systemd itself already self-heals
# these. Restarting a *system* unit needs sudo, which is not NOPASSWD
# here (`sudo -l` confirms only a short allowlist is passwordless, and
# systemctl isn't in it) — a headless daemon must never assume a sudo
# prompt will be answered, so these are alert-only via a systemd-unit
# check, same as vortexwall below, rather than given a start_cmd.
[[fleet_health.services]]
name = "cyberdeck"
check = "systemd-unit"
unit = "cyberdeck"

[[fleet_health.services]]
name = "cyberdeck-diag-deck"
check = "systemd-unit"
unit = "cyberdeck-diag-deck"

# The *other* cyberdesk instance — the darknotes portal on :8765 — has no
# systemd unit at all, unlike its :8766 diagnostics sibling above. Nothing
# currently restarts it if it dies, which is exactly the gap start_cmd is
# for. Full path, not a bare command: neither cyberdeck nor cyberdesk are
# on $PATH today (they live in the shared ~/.cargo-target build dir), and
# `sh -c` expands `~` fine even non-interactively.
[[fleet_health.services]]
name = "cyberdesk-darknotes"
check = "http"
url = "http://127.0.0.1:8765/healthz"
start_cmd = "~/.cargo-target/release/cyberdesk"

[[fleet_health.services]]
name = "vortexwall"
check = "systemd-unit"
unit = "vortexwall"
# no start_cmd: alert-only, see [security] below for why

[security]
interval_secs = 120
unit = "vortexwall"   # swap to "fail2ban" here later — no code change needed

[vault_backup]
interval_secs = 1800
path = "~/Vaults/darknotes"
push = false   # flip on once an ssh-agent is reliably loaded in your session

[repo_housekeeping]
interval_secs = 3600
cyberfleet_config = "~/.config/cyberfleet/config.json"   # reused if present
roots = []   # fallback only, used if cyberfleet_config doesn't exist
watch_prs = [
  # "darkstardevx/OmNote#4",
]

# Slice 1: read-only public/private dotfiles doctor. It checks manifests,
# bare-repo working-tree status, tracked files outside the manifest, and
# high-confidence secret patterns. It never commits, pushes, checks out, or
# rewrites $HOME. Keep auto_commit/auto_push false until a later slice adds
# an explicit approval flow.
[dotfiles]
interval_secs = 300
auto_commit = false
auto_push = false
public_git_dir = "~/.dotfiles"
private_git_dir = "~/.dotfiles-private"
public_manifest = "~/.config/apexdaemon/public-files.list"
private_manifest = "~/.config/apexdaemon/private-files.list"
snapshot_dir = "~/.local/state/apexdaemon/dotfiles-snapshots"
max_snapshots = 10

[dotfiles.security]
scan_secrets = true
exclude = [
  "Vaults/",
  "*.pem",
  "*.key",
]

[profiles]
interval_secs = 300
active = "darkbox"
directory = "~/.config/apexdaemon/profiles"
remind_on_mismatch = true

# Slice 3: read-only validation for manifest-listed shell/TOML/Lua/SVG/
# Markdown assets, plus optional latest-run status through the authenticated
# GitHub CLI. It never commits, pushes, dispatches, reruns, or publishes.
[validation]
interval_secs = 3600
check_shell = true
check_toml = true
check_lua = true
check_svg = true
check_readme_links = true
watch_ci = false
notify_success = false
workflow = "ci.yml"
repositories = []
